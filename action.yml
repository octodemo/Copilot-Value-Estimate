# action.yml (inside .github/actions/post-feedback-link/)
name: 'Copilot Survey Estimate per PR'
description: 'GH Copilot feedback survey link on pull requests'
inputs:
  base-url:
    description: 'Base survey URL (e.g., https://www.gvm-chart.com/copilot/surveys/new)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Comment survey link
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ github.token }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          📋 [Click here to complete your survey](${{ inputs.base-url }}?author=${{ github.event.pull_request.user.login }}&repo=${{ github.repository }}&prno=${{ github.event.pull_request.number }})
